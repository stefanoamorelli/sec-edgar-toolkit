name: Release TypeScript Package

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0), must match package.json'
        required: true

permissions:
  contents: read
  id-token: write  # npm trusted publishing (OIDC), no NPM_TOKEN needed

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./typescript

    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      with:
        version: 8

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        registry-url: 'https://registry.npmjs.org'

    - name: Update npm for OIDC trusted publishing
      run: npm install -g npm@latest

    - name: Install dependencies
      run: pnpm install

    - name: Extract version from tag
      id: get_version
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        fi

    - name: Update version in package.json
      run: |
        CURRENT_VERSION=$(node -p "require('./package.json').version")
        if [ "$CURRENT_VERSION" != "${{ steps.get_version.outputs.VERSION }}" ]; then
          npm version ${{ steps.get_version.outputs.VERSION }} --no-git-tag-version
        else
          echo "Version already set to ${{ steps.get_version.outputs.VERSION }}"
        fi

    - name: Build package
      run: pnpm run build

    - name: Publish to npm
      run: npm publish
