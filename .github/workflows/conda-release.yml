name: Release Conda Package

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (e.g. 0.2.0), must already be on PyPI'
        required: true

jobs:
  conda-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.11'
        conda-build-version: '*'

    - name: Extract version from tag
      id: get_version
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        fi
    
    - name: Wait for PyPI package availability
      run: |
        echo "Waiting for package to be available on PyPI..."
        for i in {1..30}; do
          if pip index versions sec-edgar-toolkit 2>/dev/null | grep -q "${{ steps.get_version.outputs.VERSION }}"; then
            echo "Package version ${{ steps.get_version.outputs.VERSION }} is available on PyPI"
            break
          fi
          echo "Attempt $i: Package not yet available, waiting 30 seconds..."
          sleep 30
        done
        
    - name: Download PyPI package and get hash
      id: get_hash
      run: |
        pip download sec-edgar-toolkit==${{ steps.get_version.outputs.VERSION }} --no-deps --no-binary :all:
        SHA256=$(sha256sum sec*edgar*toolkit*${{ steps.get_version.outputs.VERSION }}.tar.gz | cut -d' ' -f1)
        echo "SHA256=$SHA256" >> $GITHUB_OUTPUT
        
    - name: Create conda recipe
      run: |
        mkdir -p conda-recipe
        cp LICENSE conda-recipe/LICENSE
        cat > conda-recipe/meta.yaml << EOF
        {% set name = "sec-edgar-toolkit" %}
        {% set version = "${{ steps.get_version.outputs.VERSION }}" %}
        
        package:
          name: {{ name|lower }}
          version: {{ version }}
        
        source:
          url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace("-", "_") }}-{{ version }}.tar.gz
          sha256: ${{ steps.get_hash.outputs.SHA256 }}
        
        build:
          noarch: python
          script: pip install . -vv
          number: 0
        
        requirements:
          host:
            - python >=3.8
            - pip
            - setuptools
            - wheel
          run:
            - python >=3.8
            - requests >=2.31.0
        
        test:
          imports:
            - sec_edgar_toolkit
          commands:
            - pip check
          requires:
            - pip
        
        about:
          home: https://github.com/stefanoamorelli/sec-edgar-toolkit
          license: AGPL-3.0
          license_family: GPL
          license_file: LICENSE
          summary: Open source toolkit to facilitate working with the SEC EDGAR database
          description: |
            A Python toolkit for working with SEC EDGAR filing data.
            Provides tools to search, retrieve, and parse SEC filings like 10-K, 10-Q, and 8-K forms.
          doc_url: https://github.com/stefanoamorelli/sec-edgar-toolkit#readme
          dev_url: https://github.com/stefanoamorelli/sec-edgar-toolkit
        
        extra:
          recipe-maintainers:
            - stefanoamorelli
        EOF
    
    - name: Build conda package
      shell: bash -l {0}
      run: |
        conda build conda-recipe --output-folder ./conda-packages
    
    - name: Upload to Anaconda.org
      shell: bash -l {0}
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
      run: |
        conda install -y anaconda-client
        shopt -s nullglob
        anaconda -t $ANACONDA_API_TOKEN upload conda-packages/noarch/*.tar.bz2 conda-packages/noarch/*.conda --force